name: Release checks
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # package-app.sh reads the bundled ngrok version out of node_modules, so the
      # dependencies have to exist before the gate runs.
      - run: npm ci
      - run: chmod +x scripts/release.sh scripts/package-app.sh scripts/package-dmg.sh
      - run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-codebridge-beta
          path: dist/CodeBridge-0.2.0-beta.4.dmg
          if-no-files-found: error
