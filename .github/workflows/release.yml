name: Release checks
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: chmod +x release.sh package-app.sh package-dmg.sh
      - run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-codebridge-beta
          path: dist/CodeBridge-0.2.0-beta.1.dmg
          if-no-files-found: error
