name: CI
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check server.mjs && node --check core.mjs && node --check executor.mjs
      - run: mkdir -p "$RUNNER_TEMP/codebridge-state" && echo "CODEBRIDGE_HOME=$RUNNER_TEMP/codebridge-state" >> "$GITHUB_ENV"
      - run: node test.mjs
      - run: node first-run-test.mjs
      - run: node compat-test.mjs
      - run: node connector-test.mjs
      - run: node privacy-check.mjs
      - run: swift build -c release --disable-sandbox
        working-directory: native-helper
      - run: CODEBRIDGE_HELPER="$PWD/native-helper/.build/release/codebridge-helper" node e2e.mjs
      - run: swift build -c release --disable-sandbox
        working-directory: native
